name: Backtest

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Paires séparées par des virgules (ex: BTCUSDT,ETHUSDT)"
        default: "BTCUSDT"
      interval:
        description: "Unité de temps"
        type: choice
        default: "5m"
        options: ["5m", "15m", "30m", "1h", "4h", "1d"]
      start:
        description: "Date de début (AAAA-MM-JJ)"
        default: "2022-01-01"
      end:
        description: "Date de fin (vide = aujourd'hui)"
        default: ""
      risk_pct:
        description: "Risque par trade (% du capital)"
        default: "1"
      fee_pct:
        description: "Frais par ordre (%)"
        default: "0.1"
      slippage_pct:
        description: "Glissement / spread par ordre (%) — 0 = aucun"
        default: "0"
      leverage:
        description: "Levier maximum (les stops serrés demandent du levier pour risquer exactement 1 R)"
        default: "20"
      params:
        description: "Réglages stratégie (ex: trend_mode=ma;tp_fib=0.62;confirms=bubble). Vide = défaut"
        default: ""

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dépendances
        run: pip install requests pandas numpy matplotlib

      - name: Lancement de la simulation
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SYMBOLS: ${{ inputs.symbols }}
          INTERVAL: ${{ inputs.interval }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          RISK: ${{ inputs.risk_pct }}
          FEE: ${{ inputs.fee_pct }}
          LEVERAGE: ${{ inputs.leverage }}
          SLIPPAGE: ${{ inputs.slippage_pct }}
          PARAMS: ${{ inputs.params }}
        run: |
          python backtest/run_backtest.py \
            --symbols "$SYMBOLS" --interval "$INTERVAL" --start "$START" --end "$END" \
            --risk "$RISK" --fee "$FEE" --leverage "$LEVERAGE" --slippage "$SLIPPAGE" --params "$PARAMS"

      - name: Sauvegarde des résultats (trades, courbes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-backtest
          path: results/
