name: Backtest

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Paires séparées par des virgules (ex: BTCUSDT,ETHUSDT)"
        default: "BTCUSDT"
      interval:
        description: "Unité de temps"
        type: choice
        default: "5m"
        options: ["5m", "15m", "30m", "1h", "4h", "1d"]
      start:
        description: "Date de début (AAAA-MM-JJ)"
        default: "2022-01-01"
      end:
        description: "Date de fin (vide = aujourd'hui)"
        default: ""
      risk_pct:
        description: "Risque par trade (% du capital)"
        default: "1"
      fee_pct:
        description: "Frais par ordre (%)"
        default: "0.1"
      slippage_pct:
        description: "Glissement / spread par ordre (%) — 0 = aucun"
        default: "0"
      leverage:
        description: "Levier maximum (les stops serrés demandent du levier pour risquer exactement 1 R)"
        default: "20"
      confirmations:
        description: "Confirmations utilisées"
        type: choice
        default: "bulle + mss"
        options: ["bulle + mss", "mss seulement", "bulle seulement"]
      mss_swing_bars:
        description: "MSS : nb de bougies de chaque côté pour valider un plus haut / un creux (2 = petits, 5-12 = plus marqués)"
        default: "2"
      sl_min_pct:
        description: "Stop minimum en % du prix (0 = aucun ; essayer 0.3 ou 0.5 pour éviter les stops trop serrés)"
        default: "0"
      trend_filter:
        description: "Ne trader que dans le sens de la tendance ? (oui / non)"
        type: choice
        default: "oui"
        options: ["oui", "non"]
      trend_mode:
        description: "Méthode de tendance : dow (structure), ma (moyenne mobile) ou both (les deux)"
        type: choice
        default: "dow"
        options: ["dow", "ma", "both"]
      zz_atr_trend:
        description: "Lenteur de la tendance (ZigZag en ATR). Plus grand = tendance plus longue (essayer 2, 3, 4, 6)"
        default: "2"
      be_rr:
        description: "Break-even : SL déplacé au prix d'entrée quand le gain atteint X fois le risque (ex: 1, 1.5, 2). 1000 = désactivé"
        default: "1000"
      ote_react:
        description: "Retracement invalide si la zone OTE a déjà réagi (touchée puis retour au 0.5) ? (oui / non)"
        type: choice
        default: "oui"
        options: ["oui", "non"]
      params:
        description: "Réglages stratégie (ex: trend_mode=ma;tp_fib=0.62;confirms=bubble). Vide = défaut"
        default: ""

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dépendances
        run: pip install requests pandas numpy matplotlib numba

      - name: Lancement de la simulation
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SYMBOLS: ${{ inputs.symbols }}
          INTERVAL: ${{ inputs.interval }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          RISK: ${{ inputs.risk_pct }}
          FEE: ${{ inputs.fee_pct }}
          LEVERAGE: ${{ inputs.leverage }}
          SLIPPAGE: ${{ inputs.slippage_pct }}
          PARAMS: ${{ inputs.params }}
          CONFIRMATIONS: ${{ inputs.confirmations }}
          MSS_K: ${{ inputs.mss_swing_bars }}
          SL_MIN: ${{ inputs.sl_min_pct }}
          TREND_FILTER: ${{ inputs.trend_filter }}
          TREND_MODE: ${{ inputs.trend_mode }}
          ZZ_TREND: ${{ inputs.zz_atr_trend }}
          BE_RR: ${{ inputs.be_rr }}
          OTE_REACT: ${{ inputs.ote_react }}
        run: |
          if [ "$TREND_FILTER" = "non" ]; then TF=0; else TF=1; fi
          if [ "$OTE_REACT" = "non" ]; then OR=0; else OR=1; fi
          case "$CONFIRMATIONS" in
            "mss seulement") CF="mss" ;;
            "bulle seulement") CF="bubble" ;;
            *) CF="bubble,mss" ;;
          esac
          ALL="confirms=$CF;mss_fractal=$MSS_K;min_sl_pct=$SL_MIN;trend_filter=$TF;trend_mode=$TREND_MODE;zz_atr_trend=$ZZ_TREND;be_rr=$BE_RR;ote_react=$OR;$PARAMS"
          python backtest/run_backtest.py \
            --symbols "$SYMBOLS" --interval "$INTERVAL" --start "$START" --end "$END" \
            --risk "$RISK" --fee "$FEE" --leverage "$LEVERAGE" --slippage "$SLIPPAGE" --params "$ALL"

      - name: Sauvegarde des résultats (trades, courbes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-backtest
          path: results/
